<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- We can also make the title dynamic -->
    <title>{% block title %}My Website{% endblock %}</title> 
</head>
<body>
    <!-- Top Navigation Menu (Shared) -->
    <nav class="top-menu">
        <ul>
            <li><a href="/">Home</a></li>
            <!-- Added the new Items link -->
            <li><a href="/items">Items</a></li> 
            <li><a href="/about">About</a></li>
        </ul>
    </nav>

    <!-- Main Content Area (This is the "blank space" for child pages) -->
    <main class="content">
        {% block content %}
        <!-- Child pages will inject their specific HTML here -->
        {% endblock %}
    </main>

    <!-- Footer (Shared) -->
    <footer class="footer">
        <p>Contact us: info@example.com | Phone: +1 (555) 123-4567</p>
        <p>&copy; 2024 My Website. All rights reserved.</p>
    </footer>
</body>
</html>
