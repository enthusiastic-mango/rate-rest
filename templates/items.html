{% extends "base.html" %}

{% block title %}Our Items{% endblock %}

{% block content %}
    <h1>Our List of Items</h1>
    
    <div class="items-container">
        {% for item in items %}
            <!-- CHANGED: <div> is now an <a> tag -->
            <!-- href is the URL it goes to when clicked. loop.index gives us 1, 2, 3... -->
            <a class="item-card" href="/item/{{ loop.index }}">
                <h2 class="item-name">{{ item.name }}</h2>
                <p class="item-address">📍 {{ item.address }}</p>
                <p class="item-phone">📞 {{ item.phone }}</p>
                <p class="item-rating">⭐ {{ item.rating }} / 5</p>
            </a>
        {% endfor %}
    </div>
{% endblock %}
